name: CI

# Solo `main`: el trabajo rutinario se verifica en local (tests, lint,
# build) antes de mergear a `develop`, y el CI remoto queda para la rama
# que se despliega. Ejecutarlo también en cada push a `develop` quemaba
# minutos de Actions (limitados) sin aportar nada que la verificación
# local no hubiera hecho ya.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POSTGRES_SUPERUSER_PASSWORD: postgres-de-ci
  POSTGRES_APP_USER_PASSWORD: app-user-de-ci
  POSTGRES_MAINTAINER_PASSWORD: maintainer-de-ci
  S3_ACCESS_KEY: acceso-de-ci
  S3_SECRET_KEY: secreto-de-ci-suficientemente-largo

jobs:
  api:
    name: API (lint, tipos, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-de-ci
          POSTGRES_DB: ia_week_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # SeaweedFS no se puede declarar como `service`: necesita argumentos de arranque
      # y un healthcheck sobre el puerto S3, así que se levanta a mano y se espera.
      #
      # `-volume.port=8081`: por defecto `weed server` publica el volume server en
      # el 8080 además del S3 gateway en el 8333 explícito. Con `--network host` ese
      # 8080 se pega directamente al del runner y se come el puerto que necesita
      # Caddy más abajo (mismo 8080 que usa `S3_PUBLIC_BASE_URL` en local/prod) — un
      # `GET` anónimo contra el prefijo de justificantes acababa respondiendo el 400
      # crudo del volume server en vez del 403 de la regla de Caddy, dando un falso
      # verde a la prueba de seguridad. Apartar el volume server evita el choque.
      - name: Levantar SeaweedFS
        run: |
          # --network host: con -ip=127.0.0.1 el proceso escucha en el localhost del
          # contenedor, que no es alcanzable a través de un puerto publicado.
          docker run -d --name seaweedfs --network host \
            chrislusf/seaweedfs:3.97 \
            server -dir=/data -s3 -s3.port=8333 -volume.port=8081 -ip=127.0.0.1
          for intento in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8333/status > /dev/null; then
              echo "SeaweedFS listo"; break
            fi
            [ "$intento" = "40" ] && { docker logs seaweedfs; exit 1; }
            sleep 2
          done
          docker run --rm --network host \
            -e AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY \
            -e AWS_SECRET_ACCESS_KEY=$S3_SECRET_KEY \
            -e AWS_DEFAULT_REGION=us-east-1 \
            amazon/aws-cli:2.31.9 \
            --endpoint-url http://127.0.0.1:8333 s3api create-bucket --bucket media

      # Sin esto, ningún test podía comprobar de verdad la regla que deniega el
      # prefijo `accounting-receipts/` al bucket público (Fase 4 de contabilidad):
      # `S3_PUBLIC_BASE_URL` apunta a `localhost:8080/media`, pero nada escuchaba ahí.
      # Mismo `Caddyfile.dev` que usa el entorno local, con `S3_UPSTREAM` apuntando
      # al SeaweedFS ya levantado; `API_UPSTREAM`/`WEB_UPSTREAM` no se ejercitan en
      # este job (solo corren los tests de la API contra Postgres/Redis directos) así
      # que apuntan a puertos que no hace falta que respondan.
      - name: Levantar Caddy (regla de justificantes)
        run: |
          docker run -d --name caddy --network host \
            -v "$PWD/infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro" \
            -e API_UPSTREAM=127.0.0.1:8000 \
            -e WEB_UPSTREAM=127.0.0.1:4200 \
            -e S3_UPSTREAM=127.0.0.1:8333 \
            caddy:2.10-alpine
          for intento in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/media/orgs/x/accounting-receipts/y || echo 000)
            [ "$codigo" = "403" ] && { echo "Caddy listo (regla de justificantes activa)"; break; }
            [ "$intento" = "20" ] && { docker logs caddy; exit 1; }
            sleep 1
          done

      # El Caddyfile de producción es la única entrada del dominio: un error de
      # sintaxis o un `handle` mal ordenado tumbaría todo el sitio en el siguiente
      # despliegue. Se valida y se sondea la regla de justificantes a través de él,
      # igual que con el de desarrollo. Escucha en :80 y no necesita upstreams para
      # responder el 403 (la regla va antes de cualquier reverse_proxy).
      - name: Validar el Caddyfile de producción (regla de justificantes)
        run: |
          docker run --rm -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run -d --name caddy-prod -p 8090:80 \
            -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine
          for intento in $(seq 1 20); do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/media/orgs/x/accounting-receipts/y || echo 000)
            [ "$codigo" = "403" ] && { echo "Caddyfile de producción: regla de justificantes activa"; break; }
            [ "$intento" = "20" ] && { docker logs caddy-prod; exit 1; }
            sleep 1
          done
          docker rm -f caddy-prod

      - name: Crear los roles de base de datos
        env:
          PGPASSWORD: ${{ env.POSTGRES_SUPERUSER_PASSWORD }}
        run: |
          psql -h localhost -U postgres -d ia_week_test -v ON_ERROR_STOP=1 \
            -v app_user_password="$POSTGRES_APP_USER_PASSWORD" \
            -v maintainer_password="$POSTGRES_MAINTAINER_PASSWORD" \
            -v dbname=ia_week_test \
            -f infra/postgres/sql/roles.sql

      - name: Instalar libmagic
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Instalar dependencias
        working-directory: apps/api
        run: uv sync --frozen

      - name: Preparar el entorno
        run: |
          mkdir -p infra/env
          cat > infra/env/.env <<EOF
          APP_ENV=test
          DATABASE_URL=postgresql+asyncpg://app_user:$POSTGRES_APP_USER_PASSWORD@localhost:5432/ia_week_test
          DATABASE_MIGRATIONS_URL=postgresql+asyncpg://app_maintainer:$POSTGRES_MAINTAINER_PASSWORD@localhost:5432/ia_week_test
          TEST_DATABASE_URL=postgresql+asyncpg://app_user:$POSTGRES_APP_USER_PASSWORD@localhost:5432/ia_week_test
          TEST_DATABASE_MIGRATIONS_URL=postgresql+asyncpg://app_maintainer:$POSTGRES_MAINTAINER_PASSWORD@localhost:5432/ia_week_test
          S3_ENDPOINT=http://127.0.0.1:8333
          S3_ACCESS_KEY=$S3_ACCESS_KEY
          S3_SECRET_KEY=$S3_SECRET_KEY
          S3_BUCKET=media
          S3_PUBLIC_BASE_URL=http://localhost:8080/media
          REDIS_URL=redis://localhost:6379/0
          JWT_SECRET=secreto-de-integracion-continua-de-mas-de-32
          TICKET_QR_SECRET=otro-secreto-de-integracion-continua-de-mas-de-32
          TRUSTED_PROXY_CIDRS=127.0.0.1/32,::1/128
          DEFAULT_ORGANIZATION_SLUG=
          SMTP_HOST=127.0.0.1
          SMTP_PORT=1025
          TURNSTILE_ENABLED=false
          EOF

      - name: Lint y formato
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tipos
        working-directory: apps/api
        run: uv run mypy app

      - name: Tests
        working-directory: apps/api
        run: uv run pytest

      - name: Auditoría de dependencias
        working-directory: apps/api
        run: uv run pip-audit

      # El frontend genera sus tipos desde este fichero: se publica como artefacto
      # para que el job `web` compruebe que no se ha quedado desactualizado.
      - name: Exportar OpenAPI
        working-directory: apps/api
        run: uv run python -m app.cli export-openapi

      - name: Comprobar que openapi.json está al día
        run: git diff --exit-code -- apps/api/openapi.json

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: apps/api/openapi.json
          retention-days: 1

  web:
    name: Web (lint, tests, build)
    runs-on: ubuntu-latest
    needs: api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Instalar dependencias
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: apps/api

      - name: Regenerar los tipos del cliente
        working-directory: apps/web
        run: pnpm exec ng-openapi-gen --input ../api/openapi.json --output src/app/core/api/generated

      - name: Comprobar que los tipos generados están al día
        run: git diff --exit-code -- apps/web/src/app/core/api/generated

      - name: Auditoría de dependencias
        working-directory: apps/web
        run: pnpm audit --audit-level moderate

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Formato
        working-directory: apps/web
        run: pnpm format:check

      - name: Tests (incluye accesibilidad con axe)
        working-directory: apps/web
        run: pnpm test

      - name: Build
        working-directory: apps/web
        run: pnpm exec ng build

  secrets:
    name: Detección de secretos
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # La acción exige GITHUB_TOKEN para poder analizar pull requests.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
