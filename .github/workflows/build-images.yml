name: Publicar imágenes

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: imagenes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    name: ${{ matrix.componente }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - componente: api
            contexto: apps/api
          - componente: web
            contexto: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Cada despliegue referencia una imagen por SHA, no por `latest`: así un
      # rollback vuelve exactamente al artefacto que estaba corriendo.
      - id: etiquetas
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.componente }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.etiquetas.outputs.tags }}
          labels: ${{ steps.etiquetas.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}

      - name: Comprobar que la imagen no lleva secretos
        run: |
          imagen="ghcr.io/${{ github.repository }}/${{ matrix.componente }}:sha-${{ github.sha }}"
          docker pull "$imagen"
          if docker history --no-trunc "$imagen" | grep -qiE '\.env( |$)'; then
            echo "La imagen contiene un fichero .env" >&2
            exit 1
          fi
          encontrados=$(docker run --rm --entrypoint sh "$imagen" -c \
            "find / -name '.env*' -not -path '*/node_modules/*' 2>/dev/null | head -5")
          if [ -n "$encontrados" ]; then
            echo "Ficheros .env dentro de la imagen: $encontrados" >&2
            exit 1
          fi
