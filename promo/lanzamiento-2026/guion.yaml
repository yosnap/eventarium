# Versión sin voz: el título de cada pantalla cuenta la historia; las frases marcan el ritmo (y serán la
# locución cuando haya voz). Tres actos: problema → producto → llamada a la acción.
# Evidencia: docs/prd.md §4 (organizaciones, eventos, inscripción, QR, pagos, patrocinadores, contabilidad,
# legal) y las pantallas reales de apps/web.
escenas:
  - id: gancho
    pieza: rotulo
    parametros: { titulo: "Organizar un evento no debería ser un caos", subtitulo: "Eventarium lo pone en orden" }
    frases:
      - texto: "Organizar un evento no debería ser pelearse con diez hojas de cálculo."
  - id: portada
    pieza: captura
    parametros: { captura: portada, titulo: "Tus eventos, con tu marca" }
    frases:
      - texto: "Eventarium reúne en un solo sitio todo lo que necesita tu evento."
  - id: panel
    pieza: captura
    parametros: { captura: panel, titulo: "Todo tu evento en un panel" }
    frases:
      - texto: "Desde un panel ves inscripciones, ingresos y tareas pendientes."
  - id: eventos
    pieza: captura
    parametros: { captura: eventos, titulo: "Presencial, online o híbrido" }
    frases:
      - texto: "Presencial, online o híbrido; de un día o de varios."
  - id: plantillas
    pieza: captura
    parametros: { captura: plantillas, titulo: "Elige una plantilla para tu página" }
    frases:
      - texto: "Elige una plantilla y tu página queda lista para publicar."
  - id: agenda
    pieza: captura
    parametros: { captura: agenda, titulo: "Agenda con sesiones y salas" }
    frases:
      - texto: "Monta la agenda con charlas, descansos y servicios."
  - id: ponentes
    pieza: captura
    parametros: { captura: ponentes, pulsar: true, titulo: "Invita a tus ponentes" }
    frases:
      - texto: "Invita a tus ponentes por correo y ellos completan su ficha."
  - id: ficha-publica
    pieza: captura
    parametros: { captura: ficha-publica, titulo: "Inscripción gratuita, con aprobación o de pago" }
    frases:
      - texto: "Tus asistentes se inscriben en segundos, gratis, con aprobación o pagando con Stripe."
  - id: inscripciones
    pieza: captura
    parametros: { captura: inscripciones, titulo: "Aforo y lista de espera automática" }
    frases:
      - texto: "Controla el aforo y deja que la lista de espera se gestione sola."
  - id: check-in
    pieza: captura
    parametros: { captura: check-in, titulo: "Entrada QR y check-in con el móvil" }
    frases:
      - texto: "Cada asistente recibe su entrada QR y tu equipo la escanea con el móvil."
  - id: contabilidad
    pieza: captura
    parametros: { captura: contabilidad, titulo: "Presupuesto y gastos, al día" }
    frases:
      - texto: "Controla presupuesto, ingresos y gastos de cada evento."
  - id: patrocinadores
    pieza: captura
    parametros: { captura: patrocinadores, titulo: "Patrocinadores por niveles" }
    frases:
      - texto: "Gestiona patrocinadores por niveles y sus aportaciones."
  - id: politicas
    pieza: captura
    parametros: { captura: politicas, titulo: "Tus propias condiciones y páginas legales" }
    frases:
      - texto: "Publica tus propias condiciones y páginas legales."
  - id: marca
    pieza: captura
    parametros: { captura: marca, titulo: "Tu identidad visual" }
    frases:
      - texto: "Tu logo, tus colores y tus redes en cada página y cada correo."
  - id: mcp
    pieza: captura
    parametros: { captura: mcp, titulo: "Y gestiónalo desde tu asistente de IA" }
    frases:
      - texto: "Y si quieres, gestiónalo desde tu asistente de inteligencia artificial."
  - id: cierre
    pieza: logo
    parametros: { lema: "Tus eventos, de principio a fin", url: "Crea tu cuenta gratis en eventarium.org" }
    frases:
      - texto: "Eventarium. Tus eventos, de principio a fin."
