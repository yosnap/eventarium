# Despliegue de producción.
#
# El TLS lo pone el proxy del orquestador (Traefik en Dokploy/EasyPanel), pero el
# enrutado por ruta NO: el dominio se apunta entero al servicio `caddy` (puerto 80), y es
# `infra/caddy/Caddyfile` quien reparte `/api`, `/media` y el resto. Así la regla que
# bloquea los justificantes de gasto en `/media` vive en el repo y no depende del panel.
# Ver docs/despliegue.md.
#
# Las imágenes se referencian por SHA (IMAGE_TAG), nunca por `latest`: un rollback
# debe volver exactamente al artefacto que estaba corriendo.
#
# `migrate` es un servicio de un solo uso que corre antes que `api` y `worker`. Ni la
# API ni el worker migran por su cuenta: con varias réplicas, dos migraciones
# simultáneas competirían por el mismo esquema.
name: eventarium

x-imagen-api: &imagen-api
  image: ghcr.io/${GITHUB_REPOSITORY:-yosnap/eventarium}/api:${IMAGE_TAG:?falta IMAGE_TAG}

# `env_file: ./env/.env` requeriría ese fichero *dentro del checkout* que hace el
# orquestador (Dokploy, o cualquier CI que clona el repo y construye ahí mismo):
# infra/env/.env nunca se versiona, así que ese fichero no existe salvo que alguien lo
# cree a mano en el servidor. Con `environment:` + interpolación `${VAR}`, en cambio, el
# valor sale del entorno con el que se invoca `docker compose` (el `--env-file` del
# orquestador, o el shell), sin depender de ningún fichero dentro del propio checkout —
# mismo patrón que ya usaba `web` más abajo.
x-entorno-api: &entorno-api
  APP_ENV: ${APP_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL}
  DATABASE_MIGRATIONS_URL: ${DATABASE_MIGRATIONS_URL:?falta DATABASE_MIGRATIONS_URL}
  REDIS_URL: ${REDIS_URL:?falta REDIS_URL}
  S3_ENDPOINT: ${S3_ENDPOINT:?falta S3_ENDPOINT}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?falta S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?falta S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:-media}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?falta S3_PUBLIC_BASE_URL}
  WEB_BASE_URL: ${WEB_BASE_URL:?falta WEB_BASE_URL}
  JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
  MCP_JWT_SECRET: ${MCP_JWT_SECRET:-}
  ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?falta TRUSTED_PROXY_CIDRS}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  SMTP_FROM: ${SMTP_FROM:-no-responder@example.com}
  TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-true}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@example.com}
  SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
  TICKET_QR_SECRET: ${TICKET_QR_SECRET:?falta TICKET_QR_SECRET}
  TICKET_QR_EXPIRY_MARGIN_HOURS: ${TICKET_QR_EXPIRY_MARGIN_HOURS:-48}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  PAYMENT_REFUND_CUTOFF_HOURS: ${PAYMENT_REFUND_CUTOFF_HOURS:-24}
  STRIPE_WEBHOOK_RETENTION_DAYS: ${STRIPE_WEBHOOK_RETENTION_DAYS:-90}
  GA4_SERVICE_ACCOUNT_JSON: ${GA4_SERVICE_ACCOUNT_JSON:-}
  GA4_PROPERTY_ID: ${GA4_PROPERTY_ID:-}
  AI_SETTINGS_ENCRYPTION_KEY: ${AI_SETTINGS_ENCRYPTION_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?falta POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ia_week}
      POSTGRES_APP_USER_PASSWORD: ${POSTGRES_APP_USER_PASSWORD:?falta POSTGRES_APP_USER_PASSWORD}
      POSTGRES_MAINTAINER_PASSWORD: ${POSTGRES_MAINTAINER_PASSWORD:?falta POSTGRES_MAINTAINER_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/sql:/opt/postgres-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-ia_week}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    # El fichero de identidades S3 (-s3.config) no viene de un volumen montado desde
    # el repo: infra/seaweedfs/s3.json está en .gitignore (es un secreto) y solo
    # existe cuando alguien lo crea a mano en el servidor. Contra un orquestador que
    # clona el repo y construye ahí mismo (Dokploy, o cualquier CI), ese fichero
    # nunca aparece en el checkout, Docker crea un directorio vacío en su lugar y
    # SeaweedFS revienta al arrancar («fail to read ...: is a directory»). Se genera
    # en el propio arranque del contenedor a partir de las mismas S3_ACCESS_KEY /
    # S3_SECRET_KEY que ya usan api/worker/scheduler — mismo patrón que
    # `environment:` con interpolación ya aplicado más arriba, sin depender de
    # ningún fichero dentro del checkout ni de un mount aparte del orquestador.
    #
    # docker compose interpola ${S3_ACCESS_KEY}/${S3_SECRET_KEY} en el propio YAML
    # ANTES de que este script llegue al contenedor, sin escapar comillas ni
    # backslashes: generadas con secrets.token_hex/token_urlsafe (alfanumérico puro)
    # son seguras, pero una clave puesta a mano que lleve `"` o `\` rompería el JSON
    # generado y el contenedor no arrancaría. No pongas ahí una clave con esos
    # caracteres.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {
          "identities": [
            {
              "name": "app",
              "credentials": [
                {"accessKey": "${S3_ACCESS_KEY:?falta S3_ACCESS_KEY}", "secretKey": "${S3_SECRET_KEY:?falta S3_SECRET_KEY}"}
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            },
            {"name": "anonymous", "actions": ["Read:media"]}
          ]
        }
        EOF
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -volume.max=100 -ip=seaweedfs
    volumes:
      - seaweedfs-data:/data
    # Solo `caddy` llega aquí (ruta /media); el puerto S3 no se publica fuera del stack.
    expose:
      - "8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://seaweedfs:8333/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    <<: *imagen-api
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *entorno-api
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *imagen-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      <<: *entorno-api
    expose:
      - "8000"

  worker:
    <<: *imagen-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *entorno-api
    command: ["taskiq", "worker", "app.core.tasks:broker"]

  # Proceso separado del worker desde Taskiq 0.12: TaskiqScheduler corre en su propio
  # proceso, no dentro de `taskiq worker`. Ejecuta el barrido de cuentas no
  # verificadas (aviso a los 5 días, borrado a los 7) según el `schedule` fijo de la
  # tarea, no bajo demanda.
  scheduler:
    <<: *imagen-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *entorno-api
    command: ["taskiq", "scheduler", "app.core.tasks:scheduler"]

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-yosnap/eventarium}/web:${IMAGE_TAG:?falta IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      PORT: 4000
      API_INTERNAL_URL: http://api:8000
      # Dominios que el SSR acepta en Host y X-Forwarded-Host. Sin definir, acepta
      # cualquiera y la validación queda en el proxy de EasyPanel y en la resolución
      # por host de la API.
      NG_ALLOWED_HOSTS: ${NG_ALLOWED_HOSTS:-}
    expose:
      - "4000"

  # Único servicio al que el orquestador enruta el dominio. El Caddyfile está versionado,
  # así que sí existe en el checkout que hace el orquestador (a diferencia de
  # infra/env/.env o infra/seaweedfs/s3.json, que son secretos).
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    expose:
      - "80"
    # Sonda del propio Caddy (`/healthz`), no de la API: un 503 de /api/v1/health no
    # debe dejar a `caddy` unhealthy, porque Traefik dejaría de enrutar el dominio entero.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30


volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
