<!doctype html>
<html lang="es-ES">
  <head>
    <meta charset="utf-8" />
    <title>Eventarium</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Oculta desde el primer pintado lo que entra con animación (`appReveal`), para que
      no se vea primero quieto y luego desaparezca para animarse. Sin JavaScript no se
      ejecuta y todo queda visible; si la aplicación no arranca en 4 s, se muestra igual.
    -->
    <script>
      (function () {
        var raiz = document.documentElement;
        raiz.classList.add('js-activo');
        setTimeout(function () {
          if (!raiz.classList.contains('app-lista')) raiz.classList.remove('js-activo');
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
