# Ajustes de pnpm 11 (ya no se leen desde package.json ni .npmrc).
#
# pnpm no ejecuta los scripts de instalación de las dependencias y, por defecto,
# convierte ese hecho en un error. Aquí se acepta como advertencia: ninguna de las
# cuatro necesita ejecutar código en la instalación (esbuild y lmdb traen binarios
# precompilados) y no ejecutarlos reduce la superficie de la cadena de suministro.
strictDepBuilds: false
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - lmdb
  - msgpackr-extract

# Versiones con los avisos de `pnpm audit` corregidos de dependencias transitivas
# de herramientas de desarrollo (eslint, transloco, angular-cli). Se pueden quitar
# cuando sus paquetes padre suban el rango por su cuenta.
overrides:
  'brace-expansion@2': '^2.1.7'
  'brace-expansion@5': '^5.0.12'
  'fast-uri@3': '^3.1.9'
  'ip-address@10': '^10.7.4'
  'body-parser@2': '^2.4.0'
  'proxy-addr@2': '^2.0.8'
  'qs@6': '^6.16.1'
  'handlebars@4': '^4.7.10'
  'source-map-js@1': '^1.2.2'
  'undici@7': '^7.30.1'
  'undici@6': '^6.29.1'
  # Saltos de major en herramientas de desarrollo (CLI de Angular, eslint,
  # typescript-eslint, transloco): el aviso solo está corregido en glob 14 y
  # minimatch 11. Comprobado con lint, tests y build.
  'glob@10': '^14.0.2'
  'glob@13': '^14.0.2'
  'minimatch@9': '^11.0.1'
  'minimatch@10': '^11.0.1'

allowBuilds:
  '@parcel/watcher': set this to true or false
  esbuild: set this to true or false
  lmdb: set this to true or false
  msgpackr-extract: set this to true or false
