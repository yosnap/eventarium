[project]
name = "ia-week-api"
version = "0.12.0"
description = "API de la plataforma de eventos IA Week"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.13,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "aioboto3>=13.2,<16.0",
    "python-magic>=0.4.27,<0.5",
    "taskiq>=0.11,<1.0",
    "taskiq-redis>=1.0,<2.0",
    "redis>=5.2,<7.0",
    "typer>=0.15,<1.0",
    "python-multipart>=0.0.18,<0.1",
    "uuid-utils>=0.10,<1.0",
    "httpx>=0.28,<1.0",
    "aiosmtplib>=5.1.2,<6.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pip-audit>=2.7,<3.0",
    "types-aioboto3[s3]>=13.2,<16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# S101 (assert) solo se permite en tests; ver per-file-ignores.
ignore = ["B008"]  # Depends() en argumentos por defecto es el idioma de FastAPI.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["magic.*", "taskiq_redis.*", "aioboto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
