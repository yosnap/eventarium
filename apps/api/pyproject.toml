[project]
name = "ia-week-api"
version = "0.22.0"
description = "API de la plataforma de eventos IA Week"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<2.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.13,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "aioboto3>=13.2,<16.0",
    "python-magic>=0.4.27,<0.5",
    "taskiq>=0.11,<1.0",
    "taskiq-redis>=1.0,<2.0",
    "redis>=5.2,<7.0",
    "typer>=0.15,<1.0",
    "python-multipart>=0.0.18,<0.1",
    "uuid-utils>=0.10,<1.0",
    "httpx>=0.28,<1.0",
    "aiosmtplib>=5.1.2,<6.0",
    # Imagen PNG del QR de la entrada (fase 4 del PRD). Puro Python, sin
    # dependencias propias (a diferencia de `qrcode`, que necesita Pillow
    # para generar PNG) — la más ligera que cubre "PNG a partir de una
    # cadena", según el plan.
    "segno>=1.6,<2.0",
    # Pagos con Stripe Connect (fase 6 del PRD). Rango fijado a la última
    # estable (15.6.1): desde la v13 el SDK ya no tiene `stripe.error`
    # (excepción a capturar: `stripe.StripeError`, del módulo raíz).
    "stripe[async]>=15.6,<16.0",
    # API de Datos de GA4 (fase 2 del plan de cookies): estadísticas de
    # tráfico dentro del panel. Librería oficial (módulo
    # `google.analytics.data_v1beta`); sigue en beta en Google, no es un
    # rango holgado sin motivo.
    "google-analytics-data>=0.19,<1.0",
    # Biblioteca de medios (plan `260918-1944`): conversión a WebP y
    # redimensionado de imágenes subidas por usuarios. El proyecto evitó
    # Pillow deliberadamente para el QR de entradas (ver `segno` arriba),
    # pero ese caso era generar un PNG desde una cadena propia, no procesar
    # ficheros de usuario — aquí no hay alternativa razonable sin decodificar
    # imágenes. Mitigado con límite de dimensiones antes de decodificar
    # completo (ver `app/modules/media/processing.py`).
    "pillow>=12.3,<13.0",
    # Cifrado en reposo de las claves de proveedor de IA (plan
    # `260911-0325`, fase 1): `cryptography.fernet`. Rango cerrado a la
    # major actual — Fernet es estable, pero la librería rota APIs de
    # criptografía de bajo nivel entre majors. Se fija a la major que ya
    # estaba resuelta como dependencia transitiva (50.x): declararla más
    # abajo habría **degradado** la versión que el resto del árbol usa.
    "cryptography>=50.0,<51.0",
    # Cliente único de generación de la pasarela de IA (plan `260911-0325`,
    # fase 2). Se usa **solo** `litellm.acompletion` y su mapa de precios:
    # ni el proxy, ni el router, ni los callbacks.
    #
    # Tope en `<1.98` a propósito, no por pereza de rango: desde 1.98 LiteLLM
    # declara `boto3>=1.43.1` como dependencia **base** (antes solo la traía
    # el extra `proxy`, que no usamos), y `aioboto3` —el cliente S3 de la
    # biblioteca de medios y de contabilidad— arrastra `aiobotocore==2.25.1`,
    # que fija `botocore<1.40.62`. Las dos restricciones son incompatibles y
    # no hay ninguna versión de `aioboto3` publicada que admita la serie
    # 1.43 de botocore, así que subir LiteLLM aquí rompería la subida de
    # ficheros. Al soltarse ese pin en `aioboto3`, se puede ampliar el tope.
    "litellm>=1.95,<1.98",
    # Rasterización de PDF antes del OCR de justificantes (plan
    # `260910-2216`, fase 4). `pypdfium2` y no `pdf2image`: este trae el
    # binario de PDFium dentro de la rueda, así que la imagen Docker no gana
    # ninguna dependencia de sistema nueva (`poppler-utils`), que era el
    # criterio de la fase. Solo se usa para convertir páginas a mapa de bits:
    # el adaptador de OCR nunca recibe un PDF.
    "pypdfium2>=5.0,<6.0",
    "mcp==2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pip-audit>=2.7,<3.0",
    "types-aioboto3[s3]>=13.2,<16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "TID"]
# S101 (assert) solo se permite en tests; ver per-file-ignores.
ignore = ["B008"]  # Depends() en argumentos por defecto es el idioma de FastAPI.

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Confina el SDK de Stripe a un único wrapper (fase 6 del PRD, decisión #7 del
# plan): ninguna función de servicio importa `stripe` directamente, así que el
# `acct_id` de destino siempre pasa por la resolución de ese fichero.
"stripe" = { msg = "Importa stripe solo desde app/modules/payments/stripe_client.py" }

[tool.ruff.lint.per-file-ignores]
# `TID251` solo se releva en tests: la regla confina el SDK en el código de la
# aplicación (`app/`), no en la suite, que necesita construir excepciones y
# firmas reales del SDK para simular a Stripe sin red.
"tests/**" = ["S101", "S105", "S106", "S107", "TID251"]
"alembic/**" = ["E501", "S608"]
"scripts/**" = ["S608"]
"app/modules/payments/stripe_client.py" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["magic.*", "taskiq_redis.*", "aioboto3.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
